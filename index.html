<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>TextAlive Test App</title>
    <script type="module" src="/src/main.js"></script>
  </head>

  <body>

    <h1>TextAlive Test App</h1>

    <div id="controls">
      <button id="prevBtn"><img src="image/prev.png" alt="Previous" style="width: 10px; height: 10px;" /></button>
      <button id="playBtn"><img src="image/play.png" alt="Play" style="width: 10px; height: 10px;" /></button>
      <button id="pauseBtn"><img src="image/pause.png" alt="Pause" style="width: 10px; height: 10px;" /></button>
      <button id="nextBtn"><img src="image/next.png" alt="Next" style="width: 10px; height: 10px;" /></button>
    </div>

    <div id="songInfo"></div>

    <div id="lyrics">
      Waiting for lyrics...
    </div>

  </body>
</html>
